name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  test-agents:
    name: Agent Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run test:agents
        working-directory: backend

  build-backend:
    name: Backend TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npm run build
        working-directory: backend

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ''

  lint-frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npm test
        working-directory: backend

  docker-build:
    name: Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds the actual production images. `npm run build` on a full checkout
      # is NOT equivalent: the backend image copies only src/, which changes the
      # path tsc emits the entrypoint to. That divergence shipped a crash-looping
      # backend past a green CI once already - this job is the guard.
      - name: Build backend image
        run: docker build -t bytenboard-backend ./backend
      - name: Verify backend entrypoint exists in the image
        run: docker run --rm bytenboard-backend test -f dist/index.js
      - name: Build frontend image
        run: docker build --build-arg VITE_API_BASE_URL= -t bytenboard-frontend ./frontend
      - name: Verify nginx config loads with no backend reachable
        run: docker run --rm bytenboard-frontend nginx -t

  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    needs: [test-agents, test-backend, build-backend, build-frontend, lint-frontend, docker-build]

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          GEMINI_1: ${{ secrets.GEMINI_1 }}
          GEMINI_2: ${{ secrets.GEMINI_2 }}
          GEMINI_3: ${{ secrets.GEMINI_3 }}
          GEMINI_4: ${{ secrets.GEMINI_4 }}
          GEMINI_5: ${{ secrets.GEMINI_5 }}
          GEMINI_6: ${{ secrets.GEMINI_6 }}
          GEMINI_7: ${{ secrets.GEMINI_7 }}
          GEMINI_8: ${{ secrets.GEMINI_8 }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DATABASE_URL,JWT_SECRET,VITE_API_BASE_URL,GEMINI_1,GEMINI_2,GEMINI_3,GEMINI_4,GEMINI_5,GEMINI_6,GEMINI_7,GEMINI_8
          script: |
            set -e

            if [ ! -d "$HOME/bytenboard" ]; then
              echo "── Repository not found. Cloning... ──"
              git clone https://github.com/${{ github.repository }}.git ~/bytenboard
              cd ~/bytenboard
            else
              echo "── Repository found. Pulling latest code... ──"
              cd ~/bytenboard
              git fetch --all
              git reset --hard origin/main
            fi

            echo "── Writing .env from secrets ──"
            {
              echo "DATABASE_URL=$DATABASE_URL"
              echo "JWT_SECRET=$JWT_SECRET"
              echo "VITE_API_BASE_URL=$VITE_API_BASE_URL"
              echo "GEMINI_1=$GEMINI_1"
              echo "GEMINI_2=$GEMINI_2"
              echo "GEMINI_3=$GEMINI_3"
              echo "GEMINI_4=$GEMINI_4"
              echo "GEMINI_5=$GEMINI_5"
              echo "GEMINI_6=$GEMINI_6"
              echo "GEMINI_7=$GEMINI_7"
              echo "GEMINI_8=$GEMINI_8"
            } > .env

            echo "── Bringing down old containers ──"
            docker kill byte_boards_frontend byte_boards_backend 2>/dev/null || true
            docker rm -f byte_boards_frontend byte_boards_backend 2>/dev/null || true
            ORPHANS=$(docker ps -aq --filter "name=byte_boards") && [ -n "$ORPHANS" ] && docker rm -f $ORPHANS 2>/dev/null || true
            docker compose down --remove-orphans --volumes 2>/dev/null || true
            docker network rm bytenboard_default bytenboard_app-net 2>/dev/null || true

            echo "── Building and starting containers ──"
            docker compose up --build -d

            echo "── Removing unused Docker resources ──"
            docker image prune -f

            echo "Deployment complete"
