services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: bytenboard-frontend
    container_name: byte_boards_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - app-net

  backend:
    build: ./backend
    image: bytenboard-backend
    container_name: byte_boards_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3003:5000"
    networks:
      - app-net
      - global-db-net

networks:
  # Shared frontend <-> backend network. Previously `backend` declared only
  # global-db-net; naming any network replaces the implicit default, so the two
  # services shared no network at all and nginx could not resolve "backend".
  app-net:
    driver: bridge
  # External network carrying the shared `universal-db` postgres container.
  global-db-net:
    external: true
